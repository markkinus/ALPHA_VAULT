<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
</head>
<body>
    <section id="contact-section">
    <h1>Get in touch</h1>
    <p>We would love to hear from you! Please fill out the form below and we will get back to you as soon as possible.</p>

    <label for="first_name"><b>First name</b></label><br>
    <input type="text" name="first_name" required placeholder="Enter your first name"><br><br>

    <label for="last_name"><b>Last name</b></label><br>
    <input type="text" name="last_name" required placeholder="Enter your last name"><br><br>

    <label for="email"><b>Email</b></label><br>
    <input type="email" name="email" required placeholder="Enter your email"><br><br>

    <label for="phone_number"><b>Phone number</b></label><br>
    <input type="tel" name="phone_number" required placeholder="0712345678"><br>

    <p><b>Fitness goal</b></p>
    <select name="fitness goal">
        <option> --select-- </option>
        <option value="lose weight">Lose weight</option>
        <option value="build muscle">Build muscle</option>
        <option value="improve athletic performance">Improve athletic performance</option>
        <option value="enhance overall health">Enhance overall health</option>
        <option value="maintain overall wellness">Maintain overall wellness</option>
        <option value="other">Other</option><br>
    </select><br><br>

    <textarea name="message" placeholder="Enter your message here"></textarea><br><br>
    <button type="submit">Submit</button>
    </section>

</body>
</html>
